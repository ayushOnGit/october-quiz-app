<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizzly</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- main container -->

    <div class="ticket">

        <!-- app header -->

        <header class="ticket_head">

            <h1 class="ticket_tittle">Quizzly</h1>
            <span class = "ticket_eyebrow">AI Quiz Generator</span>

        </header>

        <main class="ticket-body">

            <!-- screen 1 input -->

            <section class="screen" id="screen-input" data-active="true">

                <h2>Create a Quiz</h2>
                <p class="hint">Enter Your API Key</p>

                <form id="quizForm" class="form">

                    <!-- gemini api key and label -->

                    <label class="field">
                      <span>GEMINI API KEY</span>
                      <input type="password" id="apiKeyInput" placeholder="Enter Your API Key" required>
                    </label>
                    
                    <label class="field">

                        <span>Topic</span>
                        <input type="text" id= "topicInput" placeholder="Enter Your Topic" required>

                    </label>


                    <!-- quiz setting -->

                    <div class="field-row">

                        <label class="field">
                             <span>Number of Questions</span>
                             <select id="countInput">
                                <option value="3">3</option>
                                <option value="5">5</option>
                                <option value="10">10</option>
                             </select>
                        </label>

                        <label class="field"> 
                            <span>Difficulty</span>
                            <select id="difficultyInput">
                                <option value="easy">Easy</option>
                                <option value="medium">Medium</option>
                                <option value="hard">Hard</option>
                            </select>
                        </label>

                    </div>


                    <button type="submit" class="btn">Generate Quiz</button>
                </form>

            </section>
            <!-- screen 2 loading -->

            <section class="screen" id = "screen-loading" data-active = "false">

                <div class="stamp-spinner"></div>
                <h2 id="loadingText">Writing your Quiz</h2>
                <p class="hint">this usually takes a few second</p>
            </section>

            <!-- third screen -->
             <section class="screen" id="screen-quiz" data-active="false">

                <p class="kicker" id="quizTopicLabel">Topic</p>
                <p class="progress" id="quizProgress">Question 1 of 5</p>

                <!-- progress bar fillwidth -->
                 <div class="progress-bar">
                    <div class="progress-bar_fill" id="progressFill"></div>
                 </div>

                 <!-- question text filled by script  -->
                  <h2 id="questionText"></h2>

                  <!-- empty container -->
                 <div class="options" id="optionContainer"></div>

                 <div class="quiz-action">
                    <button type="button" class="btn btn-secondary" id="prevBtn">Previous</button>
                    <button type="button" class="btn" id="nextBtn">Next</button>
                 </div>

             </section>

             <!-- results screen -->
             <section class="screen" id="screen-result" data-active="false">
                <p class="kicker" id="resultTopic">Topic</p>
                <h2>Quiz complete</h2>
                <p class="hint" id="resultSummary">You scored 0 of 0</p>
                <p class="result-score" id="resultScore">0%</p>
                <div class="result-review" id="resultReview"></div>
                <button type="button" class="btn" id="playAgainBtn">Play again</button>
             </section>

        </main>

    </div>
    <script src="script.js"></script>
</body>
</html>
